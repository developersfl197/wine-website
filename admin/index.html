<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Content Manager</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/decap-cms@3.1.4/dist/cms.css">
  <script defer src="https://cdn.jsdelivr.net/npm/decap-cms@3.1.4/dist/decap-cms.js"></script>
</head>
<body>
  <div id="cms-root"></div>
  <script>
    window.addEventListener('DOMContentLoaded', function() {
      setTimeout(function() {
        if (typeof CMS !== 'undefined') {
          CMS.init();
        }
      }, 50);
    });
  </script>
</body>
</html>
